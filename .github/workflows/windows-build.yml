# Builds the Surveyr Windows installer on a GitHub-hosted Windows machine.
#
# Run it from the Actions tab ("Run workflow"), or push a version tag (v0.3.0):
# tag pushes also publish the installer on the repo's Releases page.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # only used to attach the installer to a Release on tag pushes

defaults:
  run:
    shell: bash # Git Bash on Windows: fails fast on any error (-eo pipefail)

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Backend — install, demo data, tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python scripts/make_synthetic_terrain.py
          python scripts/make_multi_scan.py
          python -m pytest tests -q

      - name: Engine — bundle with PyInstaller
        working-directory: backend
        run: python -m PyInstaller surveyr-backend.spec --noconfirm --log-level WARN

      - name: Frontend — install and tests
        working-directory: frontend
        run: |
          npm ci
          npx vitest run

      - name: App — build the Windows installer
        working-directory: frontend
        run: npx tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: Surveyr-Windows-installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish to a GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/nsis/*.exe
