# Builds the Surveyr installers for Windows and macOS on GitHub-hosted machines.
#
# Push a version tag (v0.4.2) to build both and publish them together on the
# repo's Releases page; a release is only published if both builds succeed.
# "Run workflow" on the Actions tab builds both without publishing.
name: Release build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    shell: bash # Git Bash on Windows: fails fast on any error (-eo pipefail)

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
            installer: frontend/src-tauri/target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest # Apple silicon
            bundles: dmg
            installer: frontend/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Backend — install, demo data, tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python scripts/make_synthetic_terrain.py
          python scripts/make_multi_scan.py
          python scripts/make_jobsite_demo.py
          python -m pytest tests -q

      - name: Engine — bundle with PyInstaller
        working-directory: frontend
        run: node scripts/build-engine.mjs # same script as `npm run build:engine`

      - name: Frontend — install and tests
        working-directory: frontend
        run: |
          npm ci
          npx vitest run

      - name: App — build the installer
        working-directory: frontend
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: Surveyr-${{ matrix.name }}-installer
          path: ${{ matrix.installer }}
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the installers to the Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
